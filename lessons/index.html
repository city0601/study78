<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>數學小教室</title>
<style>
/* 版面：單欄目錄，依「冊／單元」分組，每組是一排影片卡片 */
:root{
  --bg:#eef3fb; --panel:#ffffff; --ink:#1b2438; --muted:#65708a; --line:#d9e1f0;
  --brand:#2f6fde; --brand-ink:#ffffff; --brand-soft:#e3edff; --ok:#1f9d55; --ok-soft:#e3f6ea;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --panel:#181f2e; --ink:#e8ecf6; --muted:#9aa4bb; --line:#2a3347;
  --brand:#5b8ff0; --brand-ink:#0d1320; --brand-soft:#1c2a47; --ok:#3fc27a; --ok-soft:#163525; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --panel:#181f2e; --ink:#e8ecf6; --muted:#9aa4bb; --line:#2a3347;
  --brand:#5b8ff0; --brand-ink:#0d1320; --brand-soft:#1c2a47; --ok:#3fc27a; --ok-soft:#163525; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:820px;margin:0 auto}
h1{font-size:28px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:4px 0 24px}
h2{font-size:18px;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 small{color:var(--muted);font-size:14px;font-weight:500}
section{margin-bottom:28px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px;margin-top:10px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--brand)}
a.card:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.card.soon{opacity:.6}
.no{font-size:13px;color:var(--muted);letter-spacing:.06em}
.title{font-size:19px;font-weight:700}
.meta{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--brand-soft);color:var(--brand)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>數學小教室</h1>
  <p class="lead">選一支影片開始上課。看到一半會停在小測驗，換你動腦算算看。</p>
  <div id="root"></div>
</main>
<script src="crypto.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prog(id){ try { return JSON.parse(localStorage.getItem('mp:' + id)) || {}; } catch (e) { return {}; } }
function card(l){
  const p = prog(l.id), q = p.quiz ? Object.values(p.quiz) : [];
  const tags = [];
  if (!l.ready) tags.push('<span class="tag">準備中</span>');
  else {
    if (p.done) tags.push('<span class="tag ok">已看完</span>');
    if (q.length) tags.push(`<span class="tag ok">小測驗 ${q.reduce((a, b) => a + b, 0)}/${l.quizzes || q.length} 答對</span>`);
    if (!p.done && !q.length) tags.push(`<span class="tag">約 ${l.minutes} 分鐘</span>`);
  }
  const inner = `<span class="no">${esc(l.no || '')}</span><span class="title">${esc(l.title)}</span><span class="meta">${esc(l.section || '')}</span><span class="tags">${tags.join('')}</span>`;
  return l.ready ? `<a class="card" href="watch.html?u=${encodeURIComponent(l.id)}">${inner}</a>` : `<div class="card soon">${inner}</div>`;
}
function render(){
document.getElementById('root').innerHTML = window.CATALOG.map(g => `
  <section><h2>${esc(g.unit)}${g.unitTitle ? ' <small>' + esc(g.unitTitle) + '</small>' : ''}</h2>
  <div class="list">${g.lessons.length ? g.lessons.map(card).join('') : '<p class="empty">影片準備中</p>'}</div></section>`).join('');
}
Lock.unlock('units/catalog.bin')
  .then(() => Lock.text('units/catalog.bin'))
  .then(t => { new Function(t)(); render(); })
  .catch(e => { document.getElementById('root').textContent = e.message || '載入失敗，請重新整理'; });
</script>
</body>
</html>
